name: Eval Mock Gate

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  eval-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install test dependencies
        run: |
          uv venv --python 3.11 .venv
          uv pip install -e ".[dev]"

      - name: Run unit tests (includes deterministic real-graph / fake-LLM)
        run: .venv/bin/python -m pytest -q

      - name: Measurement-trust golden gate (CPU/fixture; GPU-not-run ≠ pass)
        run: .venv/bin/python scripts/run_measurement_goldens.py

      - name: Recovery golden gate (CPU/fixture; GPU-not-run ≠ pass)
        run: .venv/bin/python scripts/run_recovery_goldens.py

      - name: Error-memory golden gate (CPU/fixture; GPU-not-run ≠ pass)
        run: .venv/bin/python scripts/run_error_memory_goldens.py

      - name: Unified ⑦ golden gate (CPU/fixture; GPU-not-run ≠ pass)
        run: .venv/bin/python scripts/run_unified_goldens.py

      - name: Real-LLM multi-run evidence (separate; blocker ≠ fake LLM)
        run: .venv/bin/python scripts/run_real_llm_goldens.py

      - name: Run mock eval harness + regression gate
        run: |
          .venv/bin/python scripts/run_eval.py \
            --mock \
            --commit-sha "${{ github.sha }}" \
            --ground-truth tests/fixtures/ground_truth \
            --output-dir eval_reports \
            --workloads chat_short long_generation \
            --budget 2 \
            --seed 7 \
            --baseline-report tests/fixtures/ci_baseline.json \
            --gate-strategy online_local_search

      - name: Run offline real-graph eval (fake LLM — no live OpenRouter)
        run: |
          .venv/bin/python scripts/run_eval.py \
            --real-graph \
            --commit-sha "${{ github.sha }}" \
            --ground-truth tests/fixtures/ground_truth \
            --output-dir eval_reports/real_graph \
            --workloads chat_short \
            --budget 3

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports-${{ github.sha }}
          path: eval_reports/
